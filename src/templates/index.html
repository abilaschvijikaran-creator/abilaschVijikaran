<!DOCTYPE html>
<html>
<head>
    <title>Radiology Text Summariser</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-family: Arial;
            font-size: 15px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 15px;
        }

        .result {
            margin-top: 30px;
            padding: 15px;
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>

    <h1>Radiology Text Summariser</h1>
    <p>Paste the findings from a chest X-ray report below and the model will summarise them into an impression.</p>

    <h3>Findings (input)</h3>
    <textarea id="findings"></textarea>

    <button onclick="getImpression()">Generate impression</button>

    <div id="result"></div>

    <script>

        function getImpression() {

            // get whatever the user typed in the box
            var findingsText = document.getElementById("findings").value;
            var resultBox = document.getElementById("result");

            // let the user know something is happening
            resultBox.innerHTML = "<p>Generating impression, please wait...</p>";

            // send the findings to the /predict endpoint
            fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ findings: findingsText })
            })
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {

                // if the API sent back an error, show that instead
                if (data.error) {
                    resultBox.innerHTML = "<div class='result'><b>Error:</b> " + data.error + "</div>";
                } else {
                    resultBox.innerHTML =
                        "<div class='result'>" +
                        "<h3>Findings sent</h3>" +
                        "<p>" + findingsText + "</p>" +
                        "<h3>Impression generated by the model</h3>" +
                        "<p>" + data.impression + "</p>" +
                        "</div>";
                }
            })
            .catch(function (error) {
                resultBox.innerHTML = "<div class='result'>Could not reach the API. Is the server running?</div>";
            });
        }

    </script>

</body>
</html>
